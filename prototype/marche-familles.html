<!doctype html>
<!-- Prototype jetable : catalogue (direction retenue B) et parcours de dépôt d’annonce, sans publication réelle. -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le petit marché — prototype</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #26352d;
      --muted: #68756c;
      --paper: #f6f5ef;
      --white: #fffefa;
      --green: #27634b;
      --green-dark: #184633;
      --lime: #d7e9bd;
      --line: #e4e5dc;
      --orange: #e89c61;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      max-width: 1320px;
      margin: auto;
      padding: 22px 38px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.04em; font-size: 20px; }
    .brand-mark { display: grid; place-items: center; width: 35px; height: 35px; border-radius: 12px 12px 12px 4px; color: white; background: var(--green); font-size: 18px; }
    .navlinks { display: flex; align-items: center; gap: 28px; color: #56645b; font-size: 14px; font-weight: 600; }
    .navlinks a:first-child { color: var(--green); }
    .profile { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 650; }
    .avatar { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: #ead6c3; color: #805e43; font-size: 12px; }
    .button-primary { border: 0; border-radius: 999px; padding: 12px 19px; color: white; background: var(--green); font-weight: 700; }
    .button-primary:hover { background: var(--green-dark); }
    .button-light { border: 1px solid var(--line); border-radius: 999px; padding: 10px 15px; background: var(--white); color: var(--ink); font-weight: 650; }
    .page { min-height: 100vh; }
    .eyebrow { margin: 0 0 11px; color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    .muted { color: var(--muted); }
    .searchbox { display: flex; align-items: center; gap: 11px; min-height: 54px; padding: 0 17px; border: 1px solid var(--line); border-radius: 15px; background: var(--white); }
    .searchbox input { width: 100%; border: 0; outline: 0; color: var(--ink); background: transparent; }
    .search-icon { color: #718077; font-size: 19px; }
    .category-row { display: flex; flex-wrap: wrap; gap: 9px; }
    .category-chip { border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; color: #59675e; background: transparent; font-size: 13px; font-weight: 650; }
    .category-chip.active { border-color: var(--green); color: white; background: var(--green); }
    .section-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; margin: 0 0 17px; }
    .section-heading h2 { margin: 0; font-size: 20px; letter-spacing: -.04em; }
    .section-heading a { color: var(--green); font-size: 13px; font-weight: 700; }
    .listing-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 17px; }
    .listing-card { min-width: 0; overflow: hidden; border: 1px solid #e9e9e1; border-radius: 18px; background: var(--white); }
    .product-art { position: relative; display: grid; place-items: center; aspect-ratio: 4 / 3; min-height: 0; overflow: hidden; font-size: 66px; }
    .product-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
    .photo-thumb { position: relative; margin: 0; aspect-ratio: 1; overflow: hidden; border-radius: 10px; background: #e9eee4; }
    .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .photo-thumb figcaption { position: absolute; left: 6px; bottom: 6px; border-radius: 999px; padding: 3px 7px; color: white; background: #184633d9; font-size: 10px; font-weight: 700; }
    .photo-remove { position: absolute; top: 5px; right: 5px; display: grid; place-items: center; width: 24px; height: 24px; border: 0; border-radius: 50%; padding: 0; color: white; background: #26352dcc; font-size: 16px; line-height: 1; }
    .photo-add { display: grid; place-content: center; justify-items: center; gap: 2px; aspect-ratio: 1; border: 1.5px dashed #b8c4b3; border-radius: 10px; color: var(--green); cursor: pointer; font-size: 12px; font-weight: 750; }
    .photo-add span { font-size: 22px; }
    #draft-photo { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .product-art::after { position: absolute; right: -23px; bottom: -43px; width: 135px; height: 100px; border-radius: 50%; background: #ffffff38; content: ""; }
    .art-blue { background: #d8e6e8; }
    .art-peach { background: #f3dfce; }
    .art-green { background: #dfe8d2; }
    .art-yellow { background: #f2e8bd; }
    .art-lilac { background: #e5e0ee; }
    .art-pink { background: #f2dcdf; }
    .art-sand { background: #eae2d2; }
    .art-sky { background: #dce9f2; }
    .condition { position: absolute; z-index: 1; top: 12px; left: 12px; border-radius: 999px; padding: 6px 9px; color: #425247; background: #fffefaeb; font-size: 10px; font-weight: 750; }
    .listing-info { padding: 14px 15px 15px; }
    .listing-info h3 { margin: 0 0 6px; font-size: 14px; line-height: 1.35; }
    .listing-meta { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 11px; }
    .price { margin-top: 13px; font-size: 16px; font-weight: 800; }
    .price.free { color: var(--green); }
    .no-results { grid-column: 1 / -1; padding: 36px; border: 1px dashed #ccd2c6; border-radius: 18px; text-align: center; color: var(--muted); }
    .bottom-space { height: 100px; }

    /* A — Un accueil chaleureux, avec recherche mise en avant et grille de trouvailles. */
    .variant-a { background: #f8f7f1; }
    .a-hero { max-width: 1244px; margin: 10px auto 0; padding: 48px 54px; border-radius: 29px; color: white; background: #27634b; }
    .a-hero-inner { display: grid; grid-template-columns: 1.1fr .9fr; align-items: center; gap: 45px; }
    .a-hero .eyebrow { color: #d5e6c7; }
    .a-hero h1 { max-width: 570px; margin: 0; font-family: Georgia, serif; font-size: clamp(37px, 5vw, 58px); font-weight: 500; letter-spacing: -.055em; line-height: 1.04; }
    .a-hero p:not(.eyebrow) { max-width: 420px; margin: 16px 0 0; color: #e0ece4; font-size: 15px; line-height: 1.6; }
    .a-search { padding: 16px; border-radius: 20px; background: white; box-shadow: 0 18px 42px #143a2b35; }
    .a-search .searchbox { border-color: transparent; background: #f5f6f0; }
    .a-search .category-row { margin-top: 13px; }
    .a-search .category-chip { border-color: #ebeee6; font-size: 11px; padding: 8px 10px; }
    .a-main { max-width: 1244px; margin: 38px auto 0; padding: 0 12px; }
    .a-main .category-row { margin-bottom: 24px; }
    .a-note { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin: 25px 0 0; padding: 15px 19px; border: 1px solid #e4e7da; border-radius: 14px; background: #f0f2e7; font-size: 12px; }
    .a-note strong { color: var(--green); }

    /* B — Un catalogue dense et pratique, avec filtres permanents et résultats en liste. */
    .variant-b { background: #f4f5f1; }
    .b-header { border-bottom: 1px solid var(--line); background: var(--white); }
    .b-header .topbar { max-width: 1440px; }
    .b-header .topbar { gap: 20px; }
    .b-actions { display: flex; align-items: center; justify-content: center; gap: clamp(10px, 1.7vw, 24px); }
    .b-action { position: relative; display: flex; align-items: center; gap: 6px; border: 0; padding: 8px 0; color: #56645b; background: transparent; font-size: 12px; font-weight: 650; white-space: nowrap; }
    .b-action:hover, .b-action.active { color: var(--green); }
    .b-action-icon { font-size: 17px; }
    .b-action-count { display: grid; place-items: center; min-width: 18px; height: 18px; border-radius: 999px; padding: 0 5px; color: white; background: #d6764b; font-size: 10px; font-weight: 750; }
    .b-layout { display: grid; grid-template-columns: 235px minmax(0, 1fr); gap: 33px; max-width: 1364px; margin: 0 auto; padding: 25px 38px 50px; }
    .b-filters { align-self: start; padding: 19px; border: 1px solid var(--line); border-radius: 17px; background: var(--white); }
    .b-filters h2 { margin: 0 0 5px; font-size: 14px; }
    .filter-group { padding: 15px 0; border-top: 1px solid #ecece5; }
    .filter-group h3 { margin: 0 0 12px; font-size: 12px; }
    .filter-option { display: flex; gap: 9px; align-items: center; margin: 10px 0; color: #626e65; font-size: 12px; }
    .filter-option input { accent-color: var(--green); }
    .filter-select { width: 100%; min-height: 37px; margin-top: 5px; border: 1px solid #dfe3da; border-radius: 9px; padding: 7px 9px; color: #48564d; background: white; font: inherit; font-size: 11px; }
    .suggestion-field { position: relative; }
    .suggestion-field input { padding-right: 38px; }
    .suggestion-toggle { position: absolute; top: 5px; right: 5px; display: grid; place-items: center; width: 34px; height: 35px; border: 0; border-radius: 7px; color: #617066; background: transparent; }
    .suggestion-toggle:hover, .suggestion-toggle[aria-expanded="true"] { color: var(--green); background: #f0f4ec; }
    .suggestion-list { position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; right: 0; display: none; max-height: 190px; overflow-y: auto; margin: 0; padding: 5px; border: 1px solid #dfe3da; border-radius: 11px; background: white; box-shadow: 0 8px 20px #26352d1c; list-style: none; }
    .suggestion-list.open { display: grid; gap: 2px; }
    .suggestion-option { width: 100%; border: 0; border-radius: 7px; padding: 9px 10px; color: #48564d; background: white; text-align: left; font-size: 12px; }
    .suggestion-option:hover, .suggestion-option:focus { color: var(--green); background: #f0f4ec; outline: 0; }
    .b-results { min-width: 0; }
    .b-results-top { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 13px; }
    .b-results-top h2 { margin: 0; font-size: 17px; }
    .sort-select { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; color: #59665d; background: var(--white); font-size: 12px; }
    .b-list { display: grid; gap: 11px; }
    .b-list .listing-card { display: grid; grid-template-columns: 145px minmax(0, 1fr) auto; align-items: center; padding: 9px; border-radius: 15px; }
    .b-list .product-art { border-radius: 10px; font-size: 46px; }
    .b-list .listing-info { padding: 10px 17px; }
    .b-list .listing-info h3 { font-size: 15px; }
    .b-list .listing-info .condition { position: static; display: inline-block; margin: 0 0 7px; padding: 0; color: #59675e; background: transparent; font-size: 10px; }
    .b-list .price { align-self: start; margin: 13px 12px 0 0; white-space: nowrap; }
    .b-list .listing-meta { justify-content: flex-start; flex-wrap: wrap; }
    .filter-reset { border: 0; padding: 4px 0; color: var(--green); background: none; font-size: 11px; font-weight: 700; }
    .b-filter-categories { display: grid; gap: 4px; }
    .b-filter-categories .category-chip { width: 100%; padding: 8px 9px; text-align: left; }
    .fixed-category { display: flex; align-items: center; min-height: 46px; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; color: var(--green); background: #f0f4ec; font-weight: 700; }
    .category-picker { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 20px; }
    .category-tile { display: grid; justify-items: start; gap: 5px; padding: 20px; border: 1.5px solid var(--line); border-radius: 16px; color: var(--ink); background: var(--white); text-align: left; }
    .category-tile:hover, .category-tile.selected { border-color: var(--green); background: #f0f4ec; }
    .category-tile-icon { display: grid; place-items: center; width: 46px; height: 46px; margin-bottom: 6px; border-radius: 13px; background: #e8efdf; font-size: 24px; }
    .category-tile-name { font-size: 16px; font-weight: 800; letter-spacing: -.02em; }
    .category-tile-hint { color: var(--muted); font-size: 12px; line-height: 1.4; }
    .category-field-grid { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .b-results-top { padding: 0 0 3px; }
    .b-results-top h2 { font-size: 18px; }

    .activity-view { max-width: 1050px; margin: 0 auto; padding: 34px 30px 70px; }
    .activity-view h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -.05em; }
    .activity-intro { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
    .activity-tabs { display: flex; gap: 7px; overflow-x: auto; margin-bottom: 17px; border-bottom: 1px solid var(--line); }
    .activity-tab { flex: 0 0 auto; border: 0; border-bottom: 2px solid transparent; padding: 12px 13px; color: var(--muted); background: transparent; font-size: 12px; font-weight: 700; }
    .activity-tab.active { border-color: var(--green); color: var(--green); }
    .activity-list { display: grid; gap: 10px; }
    .activity-item { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 17px; border: 1px solid var(--line); border-radius: 14px; background: var(--white); }
    .activity-item h2 { margin: 0 0 5px; font-size: 14px; }
    .activity-item p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .activity-item .button-light { flex: 0 0 auto; font-size: 11px; }
    .activity-listing { display: grid; align-content: start; gap: 8px; border: 0; padding: 0; color: inherit; background: transparent; text-align: left; }
    .activity-listing.unread .listing-card { border-color: var(--green); }
    .activity-listing-note { display: grid; gap: 2px; padding: 0 4px; color: var(--muted); font-size: 11px; }
    .activity-listing-note strong { color: var(--ink); font-size: 12px; }
    .activity-detail-head { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 24px; margin-top: 18px; align-items: start; }
    .activity-detail-head h2 { margin: 0 0 10px; font-size: 15px; }
    .activity-detail-head .activity-list { margin-bottom: 22px; }
    .listing-card[data-detail], .thread-item { cursor: pointer; }
    button.activity-item { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
    button.activity-item:hover, .conversation:hover { border-color: var(--green); }
    .notif-time, .conv-time { flex: 0 0 auto; color: var(--muted); font-size: 11px; }
    .conversation-list { display: grid; gap: 8px; }
    .conversation-wrap { position: relative; }
    .row-hide { position: absolute; right: 12px; bottom: 9px; border: 0; padding: 4px 8px; border-radius: 999px; color: var(--muted); background: transparent; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; }
    .row-hide:hover { color: var(--green); background: #eef0e6; }
    .conv-time { padding-bottom: 20px; }
    .conversation { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 13px; align-items: center; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; color: inherit; background: var(--white); font: inherit; text-align: left; cursor: pointer; }
    .conversation.unread { border-color: var(--green); }
    .avatar-initial { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; color: white; background: var(--green); font-size: 18px; font-weight: 800; }
    .conv-object { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .mini-thumb { position: relative; display: grid; place-items: center; flex: 0 0 auto; width: 28px; height: 28px; overflow: hidden; border-radius: 6px; font-size: 15px; }
    .mini-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .conversation.is-hidden { opacity: .55; }
    .hide-button { margin-left: auto; font-size: 11px; }
    .show-hidden { margin-top: 12px; font-size: 12px; }
    .renew-offer { display: grid; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: #fbf4ea; font-size: 12px; }
    .renew-row { display: flex; gap: 8px; }
    .renew-row input { flex: 1; min-width: 0; padding: 10px 13px; border: 1px solid var(--line); border-radius: 999px; font: inherit; }
    .detail-art { position: relative; }
    .detail-info .condition { position: static; display: inline-block; background: #eef0e6; }
    .gallery-nav { position: absolute; top: 50%; z-index: 1; width: 38px; height: 38px; margin-top: -19px; border: 0; border-radius: 50%; color: var(--ink); background: #fffefacc; font-size: 24px; cursor: pointer; }
    .gallery-nav.prev { left: 10px; } .gallery-nav.next { right: 10px; }
    .gallery-count { position: absolute; right: 10px; bottom: 10px; z-index: 1; padding: 3px 9px; border-radius: 999px; color: white; background: #0008; font-size: 11px; }
    .conv-thumb { position: relative; display: grid; place-items: center; width: 56px; height: 56px; overflow: hidden; border-radius: 10px; font-size: 26px; }
    .conv-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .conv-body { display: grid; gap: 3px; min-width: 0; font-size: 12px; }
    .conv-body strong { font-size: 13px; }
    .conv-item, .conv-last { overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
    .conversation.unread .conv-last { color: var(--ink); font-weight: 700; }
    .conv-time { display: grid; justify-items: end; gap: 6px; }
    .conv-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--orange); }
    .thread { display: grid; margin-top: 14px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--white); }
    .thread-head { display: flex; gap: 9px; align-items: baseline; padding: 13px 16px; border-bottom: 1px solid var(--line); }
    .thread-item { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 13px; align-items: center; width: 100%; padding: 10px 16px; border: 0; border-bottom: 1px solid var(--line); color: inherit; background: #faf9f3; font: inherit; text-align: left; }
    .thread-link { color: var(--green); font-size: 12px; font-weight: 800; }
    .thread-messages { display: grid; gap: 9px; padding: 16px; }
    .bubble { display: grid; gap: 6px; justify-self: start; max-width: min(78%, 460px); padding: 10px 13px; border-radius: 14px 14px 14px 4px; background: #eef0e6; font-size: 13px; line-height: 1.4; }
    .bubble.me { justify-self: end; border-radius: 14px 14px 4px 14px; color: white; background: var(--green); }
    .bubble.offer { border: 1px solid var(--green); color: var(--ink); background: #f1f8e8; }
    .bubble small { font-size: 10px; opacity: .7; }
    .offer-amount { font-size: 15px; }
    .offer-state { font-size: 11px; font-weight: 700; color: var(--green); }
    .thread-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
    .thread-form input { flex: 1; min-width: 0; padding: 11px 14px; border: 1px solid var(--line); border-radius: 999px; font: inherit; font-size: 13px; }
    .detail-view { max-width: 1050px; margin: 0 auto; padding: 24px 30px 70px; }
    .detail-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; margin-top: 18px; align-items: start; }
    .detail-art { border-radius: 18px; font-size: 110px; }
    .detail-thumbs { display: flex; gap: 8px; margin-top: 10px; }
    .detail-thumbs button { width: 64px; height: 48px; padding: 0; overflow: hidden; border: 2px solid transparent; border-radius: 8px; }
    .detail-thumbs button.active { border-color: var(--green); }
    .detail-thumbs img { width: 100%; height: 100%; object-fit: cover; }
    .detail-info h1 { margin: 8px 0 4px; font-size: 27px; letter-spacing: -.04em; }
    .detail-price { margin: 0 0 6px; font-size: 26px; font-weight: 800; }
    .detail-price.free { color: var(--green); }
    .detail-rows { display: grid; gap: 1px; margin: 18px 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--line); }
    .detail-rows div { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding: 10px 14px; background: var(--white); font-size: 13px; }
    .detail-rows dt { color: var(--muted); }
    .detail-rows dd { margin: 0; }
    .offer-box { display: grid; gap: 12px; padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--white); }
    .offer-box h2 { margin: 0; font-size: 16px; }
    .offer-box textarea, .offer-box input { padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; font: inherit; }
    .activity-buttons { display: flex; gap: 8px; }
    .activity-empty { padding: 35px; border: 1px dashed #ccd2c6; border-radius: 15px; color: var(--muted); background: #fffefa; text-align: center; font-size: 13px; }

    /* C — Un carnet éditorial : grande annonce à la une, puis petits rayons thématiques. */
    .variant-c { background: #f4eee4; }
    .c-header .topbar { max-width: 1260px; padding-top: 27px; }
    .c-masthead { max-width: 1184px; margin: 11px auto 31px; padding: 0 18px; text-align: center; }
    .c-masthead .eyebrow { color: #a36a3d; }
    .c-masthead h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(39px, 6vw, 70px); font-weight: 500; letter-spacing: -.06em; line-height: 1; }
    .c-masthead p:not(.eyebrow) { margin: 15px 0 0; color: #72695e; font-family: Georgia, serif; font-size: 17px; }
    .c-search { max-width: 510px; margin: 22px auto 0; }
    .c-shell { display: grid; grid-template-columns: 185px minmax(0, 1fr); gap: 45px; max-width: 1184px; margin: 0 auto; padding: 0 18px; }
    .c-rail { padding-top: 4px; }
    .c-rail h2 { margin: 0 0 15px; color: #9b6c43; font-family: Georgia, serif; font-size: 15px; }
    .c-rail .category-row { display: grid; gap: 4px; }
    .c-rail .category-chip { width: 100%; border: 0; border-radius: 9px; padding: 11px 12px; text-align: left; background: transparent; }
