    const conditions = ["Neuf", "Très bon", "Bon", "Satisfaisant", "À réparer"];
    let selectedCategory = "Tout";
    let selectedConditions = [];
    const selectedItemFilters = {};
    let freeOnly = false;
    let underTen = false;
    let sortOrder = "recent";
    let activityTab = "sales";
    let searchText = "";
    const initialScreen = new URLSearchParams(location.search).get("screen");
    let detailParam = new URLSearchParams(location.search).get("item") || "";
    let screen = ["create", "success", "activity", "detail"].includes(initialScreen) ? initialScreen : "browse";
    activityTab = new URLSearchParams(location.search).get("tab") || activityTab;
    let createStep = 1;
    let photos = [];
    const maxPhotos = 3;
    const emptyDraft = () => ({
      title: "", category: "", subcategory: "", condition: "", description: "", price: "",
      brand: "", author: "", language: "", color: "", ageGroups: [],
    });
    const draft = emptyDraft();
    const colors = ["Blanc", "Noir", "Gris", "Beige", "Marron", "Rouge", "Rose", "Orange", "Jaune", "Vert", "Bleu", "Violet", "Multicolore", "Autre"];
    const titleLabels = {
      "Vêtements": ["Nom du vêtement", "Ex. Veste de pluie"],
      "Livres": ["Titre du livre", "Ex. Les albums de Claude Ponti"],
      "Jeux et Jouets": ["Nom du jeu ou du jouet", "Ex. Circuit de train en bois"],
      "Matériel scolaire": ["Nom de l’article", "Ex. Cartable bleu"],
    };

    function readVariant() {
      const key = new URLSearchParams(location.search).get("variant");
      return variants.some((variant) => variant.key === key) ? key : "B";
    }

    let currentVariant = readVariant();

    function filteredItems() {
      const query = searchText.trim().toLocaleLowerCase("fr");
      const matching = items.filter((item) => {
        const categoryMatch = selectedCategory === "Tout" || item.category === selectedCategory;
        const textMatch = !query || `${item.title} ${item.category} ${item.condition}`.toLocaleLowerCase("fr").includes(query);
        const numericPrice = Number.parseFloat(item.price.replace(",", "."));
        const freeMatch = !freeOnly || item.price === "Don";
        const underTenMatch = !underTen || item.price === "Don" || numericPrice < 10;
        const conditionMatch = selectedConditions.length === 0 || selectedConditions.some((condition) => item.condition.startsWith(condition));
        const itemFiltersMatch = Object.entries(selectedItemFilters).every(([filter, value]) => {
          if (!value) return true;
          if (filter === "size") return item.size === value || (item.ageGroups || []).some((age) => clothingSizes[age] === value);
          if (filter === "schoolLevel") return (item.ageGroups || []).some((age) => schoolLevels[age] === value);
          if (filter === "ageGroup") return (item.ageGroups || []).includes(Number(value));
          return item[filter] === value;
        });
        return categoryMatch && textMatch && freeMatch && underTenMatch && conditionMatch && itemFiltersMatch;
      });
      if (sortOrder === "price") matching.sort((left, right) => {
        const leftPrice = left.price === "Don" ? 0 : Number.parseFloat(left.price.replace(",", "."));
        const rightPrice = right.price === "Don" ? 0 : Number.parseFloat(right.price.replace(",", "."));
        return leftPrice - rightPrice;
      });
      return matching;
    }

    function chips(extraClass = "") {
      return `<div class="category-row ${extraClass}">${categories.map((category) =>
        `<button class="category-chip${selectedCategory === category ? " active" : ""}" data-category="${category}" type="button">${category}</button>`
      ).join("")}</div>`;
    }

    function searchField() {
      return `<label class="searchbox"><span class="search-icon" aria-hidden="true">⌕</span><input type="search" value="${escapeHtml(searchText)}" placeholder="Que cherchez-vous ?" aria-label="Rechercher une annonce"></label>`;
    }

    function itemDetails(item, withAge = true) {
      const selectedAges = item.ageGroups || [];
      const age = selectedAges.length ? `${selectedAges.join(", ")} ans` : "";
      const sizes = item.category === "Vêtements"
        ? [...new Set(selectedAges.map((selectedAge) => clothingSizes[selectedAge]))].join(" / ")
        : "";
      const levels = ["Matériel scolaire"].includes(item.category)
        ? [...new Set(selectedAges.map((selectedAge) => schoolLevels[selectedAge]))].join(", ")
        : "";
      return [withAge ? age : "", sizes, levels ? `Niveau ${levels}` : "", item.brand, item.color, item.author, item.language].filter(Boolean).join(" · ");
    }

    function card(item, className = "") {
      const image = item.photos && item.photos.length
        ? `<img class="product-photo" src="${escapeHtml(item.photos[0])}" alt="">`
        : `<span aria-hidden="true">${item.icon}</span>`;
      const details = itemDetails(item);
      return `<article class="listing-card ${className}"${className.includes("activity-card") ? "" : ` data-detail="${escapeHtml(item.title)}"`}>
        <div class="product-art ${item.art}">${image}</div>
        <div class="listing-info"><span class="condition">${escapeHtml(item.condition)}</span><h3>${escapeHtml(item.title)}</h3><div class="listing-meta"><span>${escapeHtml(item.category)}${item.subcategory ? ` · ${escapeHtml(item.subcategory)}` : ""}</span><span>${escapeHtml(item.age)}</span></div>${details ? `<div class="listing-meta item-detail-line">${escapeHtml(details)}</div>` : ""}</div>
        <div class="price${item.price === "Don" ? " free" : ""}">${escapeHtml(item.price)}</div>
      </article>`;
    }

    function emptyResults() {
      const advice = currentVariant === "B" ? "Modifiez les filtres." : "Modifiez la recherche ou les filtres.";
      return `<p class="no-results">Aucune annonce ne correspond à votre sélection. ${advice}</p>`;
    }

    function resultsMarkup(className = "") {
      const matching = filteredItems();
      return matching.length ? matching.map((item) => card(item, className)).join("") : emptyResults();
    }

    function variantA() {
      return `<div class="page variant-a">
        <header class="topbar">
          <a class="brand" href="#"><span class="brand-mark">p</span> le petit marché</a>
          <nav class="navlinks"><a href="#">Les annonces</a><a href="#">Mes échanges</a><a href="#">Mes annonces</a></nav>
          <div class="profile"><span class="avatar">ML</span><span>Bonjour, Marie</span></div>
        </header>
        <section class="a-hero"><div class="a-hero-inner">
          <div><p class="eyebrow">Le marché des familles de l’école</p><h1>Les bonnes choses circulent.</h1><p>Vêtements, livres et trésors d’enfants trouvent une nouvelle maison, tout près d’ici.</p></div>
          <div class="a-search">${searchField()}${chips()}</div>
        </div></section>
        <section class="a-main">
          ${chips()}
          <div class="section-heading"><h2>Les dernières trouvailles</h2><a href="#">Voir toutes les annonces →</a></div>
          <div class="listing-grid">${resultsMarkup()}</div>
          <div class="a-note"><span><strong>Un objet à transmettre ?</strong> Publiez une annonce en quelques minutes.</span>          <button class="button-light" type="button" data-action="create-listing">＋ Déposer une annonce</button></div>
        </section>
        <div class="bottom-space"></div>
      </div>`;
    }

    function variantB() {
      const matchingCount = filteredItems().length;
      return `<div class="page variant-b">
        ${browseHeader()}
        <div class="b-layout">
          ${filterPanel()}
          <section class="b-results"><div class="b-results-top"><h2>${matchingCount} annonce${matchingCount === 1 ? "" : "s"}</h2><select class="sort-select" aria-label="Trier les annonces" data-sort><option value="recent"${sortOrder === "recent" ? " selected" : ""}>Plus récentes</option><option value="price"${sortOrder === "price" ? " selected" : ""}>Prix croissant</option></select></div><div class="b-list">${resultsMarkup()}</div></section>
        </div>
        <div class="bottom-space"></div>
      </div>`;
    }

    function activityLink(tab, icon, label, count) {
      return `<button class="b-action${screen === "activity" && activityTab === tab ? " active" : ""}" type="button" data-action="activity-tab" data-tab="${tab}" aria-label="${label}, ${count} à consulter"><span class="b-action-icon" aria-hidden="true">${icon}</span><span>${label}</span><span class="b-action-count">${count}</span></button>`;
    }

    function browseHeader() {
      return `<header class="b-header"><div class="topbar">
        <a class="brand" href="#" data-action="browse"><span class="brand-mark">p</span> le petit marché</a>
        <nav class="b-actions" aria-label="Actions à suivre">
          ${activityLink("sales", "🏷", "Mes ventes", unreadCount("sales"))}
          ${activityLink("purchases", "🛍", "Mes achats", unreadCount("purchases"))}
          ${activityLink("notifications", "♧", "Notifications", notificationItems.length)}
        </nav>
        <button class="button-primary" type="button" data-action="create-listing">＋ Déposer une annonce</button>
      </div></header>`;
    }

    function filterPanel() {
      return `<aside class="b-filters" aria-label="Filtres des annonces">
        <div class="b-filters-header"><h2>Filtres</h2><button class="filter-reset" type="button" data-action="reset-filters">Tout effacer</button></div>
        <div class="b-filter-groups">
          <div class="filter-group"><h3>Catégorie</h3><div class="b-filter-categories">${categories.map((category) =>
            `<button class="category-chip${selectedCategory === category ? " active" : ""}" data-category="${category}" type="button">${category}</button>`
          ).join("")}</div></div>
          <div class="filter-group"><h3>Prix</h3>
            <label class="filter-option"><input type="checkbox" data-filter="free"${freeOnly ? " checked" : ""}> Don uniquement</label>
            <label class="filter-option"><input type="checkbox" data-filter="under-ten"${underTen ? " checked" : ""}> Moins de 10 €</label>
          </div>
          <div class="filter-group"><h3>État de l’objet</h3>${conditions.map((condition) =>
            `<label class="filter-option"><input type="checkbox" data-condition="${condition}"${selectedConditions.includes(condition) ? " checked" : ""}> ${condition}</label>`
          ).join("")}</div>
          ${categorySpecificFilters()}
        </div>
      </aside>`;
    }

    function categorySpecificFilters() {
      if (selectedCategory === "Tout") return "";
      const categoryItems = items.filter((item) => item.category === selectedCategory);
      const optionsFor = (property) => [...new Set(categoryItems.map((item) => item[property]).filter(Boolean))].sort((a, b) => a.localeCompare(b, "fr"));
      const ageOptions = [...new Set(categoryItems.flatMap((item) => item.ageGroups || []))].sort((a, b) => a - b).map(String);
      const filters = [
        ["subcategory", "Type / genre", optionsFor("subcategory")],
      ];
      if (selectedCategory === "Vêtements") {
        filters.push(["brand", "Marque de vêtement", optionsFor("brand")], ["color", "Couleur", colors.filter((color) => categoryItems.some((item) => item.color === color))]);
      }
      if (selectedCategory === "Livres") {
        filters.push(["author", "Auteur / autrice", optionsFor("author")], ["language", "Langue", optionsFor("language")]);
      }
      if (selectedCategory === "Matériel scolaire") {
        filters.push(["brand", "Marque", optionsFor("brand")]);
      }
      if (selectedCategory === "Jeux et Jouets") filters.push(["brand", "Marque de jouet", optionsFor("brand")]);
      const ageLabel = selectedCategory === "Vêtements" ? "Âge – taille" : selectedCategory === "Matériel scolaire" ? "Âge – classe" : "Âge";
      const ageText = (age) => selectedCategory === "Vêtements" ? `${age} ans · ${clothingSizes[age]}` : selectedCategory === "Matériel scolaire" ? `${age} ans · ${schoolLevels[age]}` : `${age} ans`;
      if (ageOptions.length) filters.push(["ageGroup", ageLabel, ageOptions.map(ageText)]);
      return filters.filter(([, , options]) => options.length).map(([key, label, options]) =>
        `<div class="filter-group"><label for="filter-${key}"><h3>${label}</h3></label><select class="filter-select" id="filter-${key}" data-item-filter="${key}"><option value="">Tous</option>${options.map((option) => {
          const value = key === "ageGroup" ? String(parseInt(option, 10)) : option;
          return `<option value="${escapeHtml(value)}"${selectedItemFilters[key] === value ? " selected" : ""}>${escapeHtml(option)}</option>`;
        }).join("")}</select></div>`
      ).join("");
    }

    const loadedAt = Date.now();
    const ev = (from, type, value, minutes, state = "") => ({ from, type, value, state, at: loadedAt - minutes * 60000 });
    // Conversations : un fil par acheteur et par annonce, offres et messages mélangés.
    const threads = [
      { id: 1, role: "buy", title: "Veste imperméable — taille 6 ans", with: "Camille", unread: true, hidden: false, events: [
        ev("me", "message", "Bonjour, la taille est-elle grande ?", 300), ev("Camille", "message", "Bonjour, elle taille plutôt grand.", 200),
        ev("me", "offer", "7 €", 120, "Refusée"), ev("Camille", "message", "Désolée, 7 € c’est trop bas pour cette veste.", 90)] },
      { id: 2, role: "buy", title: "Collection de livres jeunesse", with: "Thomas", unread: false, hidden: false, events: [ev("me", "offer", "Don", 1500, "En attente")] },
      { id: 3, role: "sell", title: "Pull en laine", with: "Camille", unread: true, hidden: false, events: [
        ev("Camille", "message", "Le pull est-il bien chaud ?", 60), ev("Marie", "message", "Oui, 100 % laine mérinos.", 45), ev("Camille", "offer", "3 €", 25, "En attente")] },
      { id: 4, role: "sell", title: "Pull en laine", with: "Sarah", unread: false, hidden: false, events: [ev("Sarah", "offer", "4 €", 200, "En attente")] },
      { id: 5, role: "sell", title: "Puzzle 100 pièces", with: "Julien", unread: false, hidden: false, events: [
        ev("Julien", "offer", "Don", 400, "Acceptée"), ev("Julien", "message", "Merci, je passe le récupérer demain.", 300)] },
    ];
    const notificationItems = [
      { title: "Nouvelle offre", context: "Pull en laine", detail: "Camille propose 3 € pour votre annonce.", minutes: 25, thread: 3 },
      { title: "Réponse à votre offre", context: "Veste imperméable — taille 6 ans", detail: "Camille a répondu à votre demande.", minutes: 90, thread: 1 },
      { title: "Nouvelle annonce", context: "Boîte de feutres lavables", detail: "Une annonce vient d’être publiée dans Matériel scolaire.", minutes: 180, item: "Boîte de feutres lavables" },
    ];
    let activityThread = 0;
    let detailTitle = detailParam;
    let detailPhoto = 0;

    function ageMinutes(at) {
      return Math.max(0, Math.floor((Date.now() - at) / 60000));
    }

    function lastNotificationLabel(minutes) {
      if (minutes < 1) return "à l’instant";
      return minutes < 60 ? `il y a ${minutes} min` : minutes < 1440 ? `il y a ${Math.round(minutes / 60)} h` : `il y a ${Math.round(minutes / 1440)} j`;
    }

    function timeTag(at) {
      const full = new Date(at).toLocaleString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });
      return `<time datetime="${new Date(at).toISOString()}" title="${full.replace(" à ", " à ")}">${lastNotificationLabel(ageMinutes(at))}</time>`;
    }

    const lastEvent = (thread) => thread.events[thread.events.length - 1];
    const threadItem = (thread) => items.find((item) => item.title === thread.title);
    const sortedThreads = (list) => [...list].sort((a, b) => lastEvent(b).at - lastEvent(a).at);

    function eventSummary(thread) {
      const event = lastEvent(thread);
      const who = event.from === "me" || event.from === "Marie" ? "Vous" : event.from;
      return event.type === "offer" ? `${who} : offre de ${event.value}` : `${who} : ${event.value}`;
    }

    const isMine = (thread) => thread.role === "sell";
    let showHidden = false;
    const visibleThreads = (role) => sortedThreads(threads.filter((thread) => thread.role === role && (showHidden || !thread.hidden)));
    const hiddenCount = (role) => threads.filter((thread) => thread.role === role && thread.hidden).length;

    function unreadCount(tab) {
      return threads.filter((thread) => thread.role === (tab === "sales" ? "sell" : "buy") && thread.unread && !thread.hidden).length;
    }

    function miniPhoto(item) {
      return item.photos && item.photos.length ? `<img src="${escapeHtml(item.photos[0])}" alt="">` : `<span aria-hidden="true">${item.icon}</span>`;
    }

    function lastMessageText(thread) {
      const event = lastEvent(thread);
      const mine = event.from === "me" || event.from === "Marie";
      const text = event.type === "offer" ? `Offre de ${event.value}` : event.value;
      return mine ? `Vous : ${text}` : text;
    }

    function conversationRow(thread) {
      const item = threadItem(thread);
      return `<div class="conversation-wrap">
      <button class="conversation${thread.unread ? " unread" : ""}${thread.hidden ? " is-hidden" : ""}" type="button" data-action="open-thread" data-id="${thread.id}">
        <span class="avatar-initial">${escapeHtml(thread.with.charAt(0).toUpperCase())}</span>
        <span class="conv-body">
          <strong>${escapeHtml(thread.with)}${thread.hidden ? " · masquée" : ""}</strong>
          <span class="conv-last">${escapeHtml(lastMessageText(thread))}</span>
          <span class="conv-object"><span class="mini-thumb ${item.art}">${miniPhoto(item)}</span><span class="conv-item">${escapeHtml(item.title)} · ${escapeHtml(item.price)}</span></span>
        </span>
        <span class="conv-time">${timeTag(lastEvent(thread).at)}${thread.unread ? `<i class="conv-dot" aria-label="Non lu"></i>` : ""}</span>
      </button>
      <button class="row-hide" type="button" data-action="toggle-hidden" data-id="${thread.id}" data-stay="1">${thread.hidden ? "Réafficher" : "Masquer"}</button>
      </div>`;
    }

    function bubble(thread, event, index) {
      const mine = event.from === "me" || event.from === "Marie";
      const pending = thread.role === "sell" && event.type === "offer" && !mine && event.state === "En attente";
      const body = event.type === "offer"
        ? `<strong class="offer-amount">Offre : ${escapeHtml(event.value)}</strong><span class="offer-state">${escapeHtml(event.state)}</span>`
        : `<span>${escapeHtml(event.value)}</span>`;
      const actions = pending ? `<span class="activity-buttons"><button class="button-light" type="button" data-action="answer-offer" data-id="${thread.id}" data-index="${index}" data-answer="Refusée">Refuser</button><button class="button-primary" type="button" data-action="answer-offer" data-id="${thread.id}" data-index="${index}" data-answer="Acceptée">Accepter</button></span>` : "";
      return `<div class="bubble ${mine ? "me" : "them"}${event.type === "offer" ? " offer" : ""}">${body}${actions}<small>${timeTag(event.at)}</small></div>`;
    }

    function renewOfferForm(thread) {
      if (thread.role !== "buy") return "";
      const offers = thread.events.filter((event) => event.type === "offer");
      const last = offers[offers.length - 1];
      if (!last || last.state !== "Refusée") return "";
      return `<form class="renew-offer" data-renew-form data-id="${thread.id}"><strong>Votre offre de ${escapeHtml(last.value)} a été refusée.</strong>
        <div class="renew-row"><input name="amount" type="number" min="0" step="1" inputmode="numeric" placeholder="Nouveau montant (€)" aria-label="Nouveau montant en euros" required><button class="button-primary" type="submit">Refaire une offre</button></div></form>`;
    }

    function threadView() {
      const thread = threads.find((entry) => entry.id === activityThread);
      if (!thread) return "";
      const item = threadItem(thread);
      const backLabel = thread.role === "sell" ? "← Mes ventes" : "← Mes achats";
      const photo = item.photos && item.photos.length ? `<img src="${escapeHtml(item.photos[0])}" alt="">` : `<span aria-hidden="true">${item.icon}</span>`;
      const bubbles = thread.events.map((event, index) => ({ event, index })).sort((a, b) => a.event.at - b.event.at)
        .map(({ event, index }) => bubble(thread, event, index)).join("");
      return `<button class="button-light" type="button" data-action="close-thread">${escapeHtml(backLabel)}</button>
        <div class="thread">
          <header class="thread-head"><strong>${escapeHtml(thread.with)}</strong><span class="muted">${thread.role === "sell" ? "Acheteur" : "Vendeur"}</span><button class="button-light hide-button" type="button" data-action="toggle-hidden" data-id="${thread.id}">${thread.hidden ? "Réafficher" : "Masquer"}</button></header>
          <button class="thread-item" type="button" data-detail="${escapeHtml(item.title)}"><span class="conv-thumb ${item.art}">${photo}</span><span class="conv-body"><strong>${escapeHtml(item.title)}</strong><span class="conv-item">${escapeHtml(item.price)} · ${escapeHtml(item.condition)}</span></span><span class="thread-link">Voir l’annonce</span></button>
          <div class="thread-messages">${bubbles}</div>
          ${renewOfferForm(thread)}
          <form class="thread-form" data-thread-form data-id="${thread.id}"><input name="text" type="text" placeholder="Écrire un message…" autocomplete="off" aria-label="Votre message"><button class="button-primary" type="submit">Envoyer</button></form>
        </div>`;
    }

    function activityContent() {
      if (activityTab === "notifications") {
        return `<div class="activity-list">${[...notificationItems].sort((a, b) => a.minutes - b.minutes).map((note, index) =>
          `<button class="activity-item" type="button" data-action="open-notification" data-index="${notificationItems.indexOf(note)}"><div><h2>${note.title}</h2><p>${note.context}<br>${note.detail}</p></div><span class="notif-time">${timeTag(loadedAt - note.minutes * 60000)}</span></button>`).join("")}</div>`;
      }
      if (activityThread) return threadView();
      const role = activityTab === "sales" ? "sell" : "buy";
      const list = visibleThreads(role);
      const hidden = hiddenCount(role);
      const toggle = hidden ? `<button class="button-light show-hidden" type="button" data-action="toggle-show-hidden">${showHidden ? "Masquer les conversations cachées" : `Voir les conversations masquées (${hidden})`}</button>` : "";
      const empty = role === "sell" ? "Aucun acheteur ne vous a encore écrit." : "Vous n’avez encore contacté aucun vendeur.";
      return `${list.length ? `<div class="conversation-list">${list.map(conversationRow).join("")}</div>` : `<p class="activity-empty">${empty}</p>`}${toggle}`;
    }

    function detailScreen() {
      const item = items.find((entry) => entry.title === detailTitle);
      if (!item) return `<div class="page variant-b">${browseHeader()}<section class="activity-view"><p class="activity-empty">Cette annonce n’existe plus.</p></section></div>`;
      const photoList = item.photos || [];
      const current = Math.min(detailPhoto, Math.max(photoList.length - 1, 0));
      const main = photoList.length ? `<img class="product-photo" src="${escapeHtml(photoList[current])}" alt="Photo ${current + 1} sur ${photoList.length}">` : `<span aria-hidden="true">${item.icon}</span>`;
      const arrows = photoList.length > 1 ? `<button class="gallery-nav prev" type="button" data-gallery="-1" aria-label="Photo précédente">‹</button><button class="gallery-nav next" type="button" data-gallery="1" aria-label="Photo suivante">›</button><span class="gallery-count">${current + 1} / ${photoList.length}</span>` : "";
      const thumbs = photoList.length > 1 ? `<div class="detail-thumbs">${photoList.map((url, index) => `<button type="button" class="${index === current ? "active" : ""}" data-detail-photo="${index}" aria-label="Photo ${index + 1}"><img src="${escapeHtml(url)}" alt=""></button>`).join("")}</div>` : "";
      const rows = [
        ["Catégorie", item.category], ["Type / genre", item.subcategory], ["État", item.condition],
        ["Âge", (item.ageGroups || []).length ? `${formatAgeList(item.ageGroups)} ans` : ""], ["Détails", itemDetails(item, false)],
      ].filter(([, value]) => value).map(([label, value]) => `<div><dt>${label}</dt><dd>${escapeHtml(value)}</dd></div>`).join("");
      const free = item.price === "Don";
      const mine = item.owner === "Marie";
      const existing = threads.find((thread) => thread.role === "buy" && thread.title === item.title);
      const offerBox = mine
        ? `<div class="offer-box"><p class="muted">C’est votre annonce.</p><button class="button-light" type="button" data-action="activity-tab" data-tab="sales">Voir mes ventes</button></div>`
        : `<form class="offer-box" data-offer-form data-title="${escapeHtml(item.title)}">
            <h2>${free ? "Demander ce don" : "Faire une offre"}</h2>
            ${free ? "" : `<div class="form-field"><label for="offer-amount">Votre offre (€)</label><input id="offer-amount" name="amount" type="number" min="0" step="1" inputmode="numeric" value="${Number.parseInt(item.price, 10) || ""}" required></div>`}
            <div class="form-field"><label for="offer-text">Message <span class="muted">(facultatif)</span></label><textarea id="offer-text" name="text" rows="3" placeholder="Bonjour, je suis intéressé(e)…"></textarea></div>
            <button class="button-primary" type="submit">${free ? "Envoyer ma demande" : "Envoyer mon offre"}</button>
            ${existing ? `<button class="button-light" type="button" data-action="open-thread" data-id="${existing.id}" data-tab="purchases">Voir ma conversation</button>` : ""}
          </form>`;
      return `<div class="page variant-b">${browseHeader()}<section class="detail-view">
        <button class="button-light" type="button" data-action="browse">← Retour aux annonces</button>
        <div class="detail-grid">
          <div><div class="product-art detail-art ${item.art}">${main}${arrows}</div>${thumbs}</div>
          <div class="detail-info">
            <span class="condition">${escapeHtml(item.condition)}</span>
            <h1>${escapeHtml(item.title)}</h1>
            <p class="detail-price${free ? " free" : ""}">${escapeHtml(item.price)}</p>
            <p class="muted">Proposé par ${escapeHtml(item.owner)} · ${escapeHtml(item.age)}</p>
            <dl class="detail-rows">${rows}</dl>
            ${offerBox}
          </div>
        </div></section></div>`;
    }

    function activityScreen() {
      const tabNames = { sales: "Mes ventes", purchases: "Mes achats", notifications: "Notifications" };
      const intro = { sales: "Vos conversations avec les acheteurs, de la plus récente à la plus ancienne.", purchases: "Vos conversations avec les vendeurs, de la plus récente à la plus ancienne.", notifications: "Les nouveautés du marché." };
      return `<div class="page variant-b">${browseHeader()}<section class="activity-view">
        <h1>${tabNames[activityTab]}</h1><p class="activity-intro">${intro[activityTab]}</p>
        <nav class="activity-tabs" aria-label="Mon activité">${Object.entries(tabNames).map(([tab, label]) =>
          `<button class="activity-tab${activityTab === tab ? " active" : ""}" type="button" data-action="activity-tab" data-tab="${tab}">${label}</button>`
        ).join("")}</nav>
        ${activityContent()}
      </section></div>`;
    }

    function variantC() {
      const matching = filteredItems();
      const feature = matching[0];
      const rest = matching.slice(1);
      return `<div class="page variant-c">
        <header class="c-header"><div class="topbar">
          <a class="brand" href="#"><span class="brand-mark">p</span> le petit marché</a>
          <nav class="navlinks"><a href="#">Le marché</a><a href="#">Mes messages</a><a href="#">Mon compte</a></nav>
          <button class="button-primary" type="button" data-action="create-listing">Déposer un objet</button>
        </div></header>
        <section class="c-masthead"><p class="eyebrow">La brocante de notre école</p><h1>De belles histoires<br>à faire circuler.</h1><p>Des objets aimés, prêts pour une nouvelle aventure.</p><div class="c-search">${searchField()}</div></section>
        <div class="c-shell">
          <aside class="c-rail"><h2>Les rayons</h2>${chips()}</aside>
          <section class="c-content">
            ${feature ? `<article class="c-feature"><div class="c-feature-copy"><p class="eyebrow">À découvrir aujourd’hui</p><h2>${feature.title}</h2><p>${feature.condition} · proposé par ${feature.owner}</p><button class="button-primary" type="button">Découvrir · ${feature.price}</button></div><div class="c-feature-art ${feature.art}" aria-hidden="true">${feature.icon}</div></article>` : emptyResults()}
            <div class="c-section"><div class="section-heading"><h2>Encore de jolies choses</h2><a href="#">Tout le rayon →</a></div><div class="listing-grid">${rest.length ? rest.map((item) => card(item)).join("") : (feature ? `<p class="no-results">C’est tout pour cette sélection.</p>` : "")}</div></div>
            <p class="c-localline">Une communauté de familles · Échanges organisés entre vous, en toute simplicité.</p>
          </section>
        </div>
        <div class="bottom-space"></div>
      </div>`;
    }

    function publishHeader() {
      return `<header class="publish-header"><div class="topbar">
        <a class="brand" href="#" data-action="browse"><span class="brand-mark">p</span> le petit marché</a>
        <span class="muted" style="font-size:12px">Espace famille · Marie L.</span>
      </div></header>`;
    }

    function progressSteps() {
      const labels = ["Catégorie", "Photos", "Objet", "Aperçu"];
      return `<aside class="publish-steps"><h2>Nouvelle annonce</h2><div class="publish-step-list">${labels.map((label, index) =>
        `<p class="publish-step${createStep === index + 1 ? " active" : ""}"><span class="publish-step-number">${index + 1}</span>${label}</p>`
      ).join("")}</div></aside>`;
    }

    function photoPreviewMarkup() {
      return photos.length ? `<img src="${escapeHtml(photos[0])}" alt="Photo principale de l’annonce">` : "📷";
    }

    function itemSpecificFields() {
      if (draft.category === "Vêtements") return `<div class="form-field"><label for="draft-brand">Marque de vêtement <span class="muted">(facultative)</span></label>${suggestedInput("brand", "clothingBrand", "Marque de vêtement", "Ex. Petit Bateau")}</div>
        <div class="form-field"><label for="draft-color">Couleur</label><select id="draft-color" name="color" required><option value="">Choisir une couleur</option>${colors.map((color) => `<option value="${color}"${draft.color === color ? " selected" : ""}>${color}</option>`).join("")}</select>${otherHint(draft.color)}</div>`;
      if (draft.category === "Livres") return `<div class="form-field"><label for="draft-author">Auteur ou autrice <span class="muted">(facultatif)</span></label>${suggestedInput("author", "author", "Auteur ou autrice", "Ex. Claude Ponti")}</div>
        <div class="form-field"><label for="draft-language">Langue <span class="muted">(facultative)</span></label>${suggestedInput("language", "language", "Langue", "Ex. Français")}</div>`;
      if (draft.category === "Jeux et Jouets") return `<div class="form-field"><label for="draft-brand">Marque de jouet <span class="muted">(facultative)</span></label>${suggestedInput("brand", "toyBrand", "Marque de jouet", "Ex. Playmobil")}</div>`;
      if (draft.category === "Matériel scolaire") return `<div class="form-field"><label for="draft-brand">Marque <span class="muted">(facultative)</span></label>${suggestedInput("brand", "schoolBrand", "Marque", "Ex. Eastpak")}</div>`;
      return "";
    }

    function derivedEquivalentText() {
      if (!draft.ageGroups.length) return "Choisissez un ou plusieurs âges.";
      if (draft.category === "Vêtements") {
        return `Tailles correspondantes : ${[...new Set(draft.ageGroups.map((age) => clothingSizes[age]))].join(" / ")}`;
      }
      if (draft.category === "Matériel scolaire") {
        const levels = [...new Set(draft.ageGroups.map((age) => schoolLevels[age]))].join(", ");
        return `Niveaux scolaires indicatifs : ${levels}${draft.ageGroups.includes(11) ? " (correspondance indicative pour 11 ans)" : ""}`;
      }
      return `Pour ${formatAgeList(draft.ageGroups)} ans`;
    }

    function formatAgeList(ageGroups) {
      if (ageGroups.length < 2) return ageGroups.join("");
      if (ageGroups.length === 2) return `${ageGroups[0]} et ${ageGroups[1]}`;
      return `${ageGroups.slice(0, -1).join(", ")} et ${ageGroups.at(-1)}`;
    }

    function photoGuidance() {
      let tips;
      if (draft.category === "Vêtements") {
        tips = ["Vue de face et de dos", "Étiquette de taille et de marque", "Détail des éventuelles marques d’usage"];
      } else if (draft.category === "Livres") {
        tips = ["Couverture", "Quatrième de couverture et ISBN", "Pages ou défauts utiles à voir"];
      } else if (draft.category === "Jeux et Jouets") {
        tips = ["Boîte / vue d’ensemble", "Contenu complet étalé", "Règle, accessoires et pièces manquantes"];
      } else if (draft.category === "Matériel scolaire") {
        tips = ["Vue d’ensemble", "Étiquette / marque si utile", "Contenu, accessoires ou défauts"];
      } else {
        tips = ["Vue d’ensemble de l’objet", "Étiquette ou référence si utile", "Détails et défauts éventuels"];
      }
      return `<div class="photo-guidance"><strong>Pour ce type d’objet, pensez à montrer :</strong><ul>${tips.map((tip) => `<li>${tip}</li>`).join("")}</ul></div>`;
    }

    function agePicker() {
      return `<fieldset class="age-picker" aria-required="true" aria-describedby="age-picker-hint">
        <legend>Âges concernés (3 à 11 ans)<span aria-hidden="true"> *</span></legend>
        <div class="age-options">${ages.map((age) =>
          `<label class="age-option${draft.ageGroups.includes(age) ? " selected" : ""}"><input type="checkbox" name="ageGroup" value="${age}"${draft.ageGroups.includes(age) ? " checked" : ""}><span>${age} ans</span></label>`
        ).join("")}</div>
        <span class="field-hint" id="age-picker-hint">Choisissez un ou plusieurs âges. Les tailles ou niveaux correspondants seront calculés automatiquement.</span>
        ${draft.ageGroups.length ? `<span class="derived-value">${escapeHtml(derivedEquivalentText())}</span>` : ""}
        <span class="age-error" hidden>Sélectionnez au moins un âge.</span>
      </fieldset>`;
    }

    function suggestedInput(name, suggestionKey, label, placeholder) {
      const listId = `suggestions-${suggestionKey}`;
      return `<div class="suggestion-field"><input id="draft-${name}" name="${name}" value="${escapeHtml(draft[name])}" placeholder="${placeholder}" autocomplete="off" aria-label="${label}" aria-autocomplete="list" aria-controls="${listId}" data-suggestion-key="${suggestionKey}"><button class="suggestion-toggle" type="button" aria-label="Afficher les suggestions de ${label.toLocaleLowerCase("fr")}" aria-expanded="false" data-suggestion-toggle="${suggestionKey}">⌄</button><ul class="suggestion-list" id="${listId}" role="listbox">${suggestionOptions(suggestionKey, draft[name])}</ul></div><span class="field-hint">Suggestions déjà utilisées ; la saisie reste libre.</span>`;
    }

    function suggestionOptions(name, query = "") {
      const normalizedQuery = query.trim().toLocaleLowerCase("fr");
      return (valueSuggestions[name] || [])
        .filter((value) => value.toLocaleLowerCase("fr").includes(normalizedQuery))
        .map((value) => `<li role="option"><button class="suggestion-option" type="button" data-suggestion-value="${escapeHtml(value)}">${escapeHtml(value)}</button></li>`)
        .join("");
    }

    function normalizeValue(value) {
      return value.trim().toLocaleLowerCase("fr").replace(/(^|[-\s'’])([\p{L}\p{N}])/gu, (match, separator, firstLetter) =>
        separator + firstLetter.toLocaleUpperCase("fr")
      );
    }

    function rememberValue(name, value) {
      const normalizedValue = normalizeValue(value);
      if (!normalizedValue || !valueSuggestions[name]) return normalizedValue;
      if (!valueSuggestions[name].some((existing) => existing.toLocaleLowerCase("fr") === normalizedValue.toLocaleLowerCase("fr"))) {
        valueSuggestions[name].push(normalizedValue);
      }
      return normalizedValue;
    }

    const needsDetail = () => draft.color === "Autre" || ["Autre", "Autres"].includes(draft.subcategory);
    const otherHint = (value) => `<span class="field-hint other-hint"${["Autre", "Autres"].includes(value) ? "" : " hidden"}>Précisez dans la description.</span>`;

    function selectedSubcategories() {
      return subcategories[draft.category] || [];
    }

    function priceLabel() {
      return Number.parseFloat(draft.price || "0") === 0 ? "Don" : `${escapeHtml(draft.price)} €`;
    }

    const categoryTiles = {
      "Vêtements": ["👕", "Hauts, pantalons, manteaux, chaussures…"],
      "Livres": ["📚", "Albums, romans, BD et manga, manuels…"],
      "Jeux et Jouets": ["🧸", "Dinette, puzzles, jeux de société…"],
      "Matériel scolaire": ["🎒", "Cartables, fournitures, papeterie…"],
    };

    function categoryStep() {
      return `<section class="publish-panel"><h2>Que souhaitez-vous proposer ?</h2><p>Choisissez la catégorie : elle ne pourra plus être modifiée une fois l’annonce commencée.</p>
        <div class="category-picker">${categories.slice(1).map((category) =>
          `<button class="category-tile${draft.category === category ? " selected" : ""}" type="button" data-pick-category="${category}"><span class="category-tile-icon" aria-hidden="true">${categoryTiles[category][0]}</span><span class="category-tile-name">${category}</span><span class="category-tile-hint">${categoryTiles[category][1]}</span></button>`
        ).join("")}</div></section>`;
    }

    function photoStep() {
      return `<section class="publish-panel">
        <h2>Ajoutez des photos</h2><p>Plusieurs angles aident les familles à se décider.</p>
        ${photoGuidance()}
        <div class="upload-box" id="photo-drop-zone">
          <div class="photo-grid">${photos.map((url, index) => `<figure class="photo-thumb"><img src="${escapeHtml(url)}" alt="Photo ${index + 1}">${index === 0 ? `<figcaption>Principale</figcaption>` : ""}<button class="photo-remove" type="button" data-remove-photo="${index}" aria-label="Retirer la photo ${index + 1}">×</button></figure>`).join("")}${photos.length < maxPhotos ? `<label class="photo-add" for="draft-photo"><span aria-hidden="true">＋</span>Ajouter</label>` : ""}</div>
          <input id="draft-photo" type="file" accept="image/*" multiple>
          <span class="field-hint">Glissez vos photos ici ou utilisez « Ajouter » : ${photos.length}/${maxPhotos}. La première est la photo principale. Les photos restent sur cet appareil dans cette maquette.</span>
        </div>
        <span class="field-hint">Photos facultatives, jusqu’à 5.</span>
      </section>`;
    }

    function createForm() {
      const subcategoryOptions = selectedSubcategories().map((subcategory) =>
        `<option value="${subcategory}"${draft.subcategory === subcategory ? " selected" : ""}>${subcategory}</option>`
      ).join("");
      const objectStep = () => `<section class="publish-panel">
          <h2>Décrivez l’objet</h2><p>Renseignez les précisions utiles aux autres familles.</p>
          <div class="publish-form-grid">
            <div class="form-field"><span class="form-label">Catégorie</span><div class="fixed-category">${draft.category}</div></div>
            <div class="form-field"><label for="draft-subcategory">Type/Genre</label><select id="draft-subcategory" name="subcategory" required><option value="">Choisir un type/genre</option>${subcategoryOptions}</select>${otherHint(draft.subcategory)}</div>
            <div class="form-field"><label for="draft-condition">État de l’objet</label><select id="draft-condition" name="condition" required><option value="">Choisir l’état</option>${conditions.map((condition) => `<option value="${condition}"${draft.condition === condition ? " selected" : ""}>${condition}</option>`).join("")}</select></div>
            ${agePicker()}
            <div class="category-field-grid" id="category-detail-fields">${itemSpecificFields()}</div>
            <div class="form-field"><label for="draft-title">${titleLabels[draft.category][0]}</label><input id="draft-title" name="title" value="${escapeHtml(draft.title)}" maxlength="70" placeholder="${titleLabels[draft.category][1]}" required></div>
            <div class="form-field"><label for="draft-price">Prix (€)</label><input id="draft-price" name="price" type="number" min="0" step="1" value="${escapeHtml(draft.price)}" placeholder="0 pour donner" required><span class="field-hint">${Number.parseFloat(draft.price || "0") === 0 ? "Le prix à 0 € sera affiché comme un don." : "Prix affiché aux autres familles."}</span></div>
            <div class="form-field full"><label for="draft-description">Description <span class="muted">${needsDetail() ? "(à préciser)" : "(facultative)"}</span></label><textarea id="draft-description" name="description" maxlength="500"${needsDetail() ? " required" : ""} placeholder="Détails utiles, contenu du lot, petites marques d’usage…">${escapeHtml(draft.description)}</textarea><span class="field-hint">Restez factuel : décrivez l’objet et son état.</span></div>
          </div>
        </section>`;
      const previewStep = () => `<section class="publish-panel">
          <h2>Vérifiez votre annonce</h2><p>Voici ce que les autres familles verront dans les annonces du marché.</p>
          <article class="preview-card">
            <div class="preview-image">${photoPreviewMarkup()}</div>
            <div class="preview-details"><span class="condition">${escapeHtml(draft.condition)}</span><h2>${escapeHtml(draft.title)}</h2><div class="listing-meta"><span>${escapeHtml(draft.category)} · ${escapeHtml(draft.subcategory)}</span></div>${itemDetails(draft) ? `<p>${escapeHtml(itemDetails(draft))}</p>` : ""}<div class="preview-price">${priceLabel()}</div><p>${escapeHtml(draft.description || "Aucune description ajoutée.")}</p></div>
          </article>
        </section>`;
      const formStep = [categoryStep, photoStep, objectStep, previewStep][createStep - 1]();

      const back = (label) => `<button class="button-light" type="button" data-action="previous-step">${label}</button>`;
      const actions = createStep === 1
        ? `<div class="publish-actions"><button class="button-light" type="button" data-action="browse">Annuler</button>${draft.category ? `<button class="button-primary" type="button" data-action="next-step">Continuer →</button>` : ""}</div>`
        : createStep === 4
          ? `<div class="publish-actions">${back("← Modifier")}<button class="button-primary" type="button" data-action="publish">Publier</button></div>`
          : `<div class="publish-actions">${back("← Retour")}<button class="button-primary" type="button" data-action="next-step">${createStep === 3 ? "Voir l’aperçu →" : "Continuer →"}</button></div>`;

      return `<div class="page publish-page">${publishHeader()}<div class="publish-layout">${progressSteps()}<section class="publish-content">
        <p class="eyebrow">Le marché des familles de l’école</p><h1>Déposer une annonce</h1>
        ${formStep}${actions}
      </section></div></div>`;
    }

    function successScreen() {
      return `<div class="page publish-page">${publishHeader()}<section class="publish-confirm">
        <span class="publish-confirm-icon" aria-hidden="true">✓</span><p class="eyebrow">Annonce publiée</p><h1>Votre annonce est en ligne</h1>
        <p>Cette publication est simulée pour le prototype : rien n’est envoyé ni sauvegardé.</p>
        <button class="button-primary" type="button" data-action="browse">Retourner aux annonces</button>
      </section></div>`;
    }

    const renderers = { A: variantA, B: variantB, C: variantC };

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[character]);
    }

    function updateUrl() {
      const url = new URL(location.href);
      url.searchParams.set("variant", currentVariant);
      if (screen === "browse") url.searchParams.delete("screen");
      else url.searchParams.set("screen", screen);
      if (screen === "detail") url.searchParams.set("item", detailTitle);
      else url.searchParams.delete("item");
      if (screen === "activity") url.searchParams.set("tab", activityTab);
      else url.searchParams.delete("tab");
      history.replaceState({}, "", url);
    }

    function render() {
      const app = document.querySelector("#app");
      const switcher = document.querySelector(".prototype-switcher");
      switcher.hidden = screen !== "browse";
      app.innerHTML = screen === "create" ? createForm() : screen === "success" ? successScreen() : screen === "activity" ? activityScreen() : screen === "detail" ? detailScreen() : renderers[currentVariant]();
      if (screen === "browse") document.querySelector("#variant-label").innerHTML = `<strong>${currentVariant}</strong> · ${variants.find((variant) => variant.key === currentVariant).name}`;
      const threadInput = document.querySelector("[data-thread-form] input");
      if (threadInput) threadInput.scrollIntoView({ block: "end" });
      document.querySelectorAll("[data-category]").forEach((button) => {
        button.addEventListener("click", () => {
          selectedCategory = button.dataset.category;
          Object.keys(selectedItemFilters).forEach((key) => delete selectedItemFilters[key]);
          render();
        });
      });
      document.querySelectorAll('input[type="search"]').forEach((input) => {
        input.addEventListener("input", () => {
          searchText = input.value;
          const cursor = input.selectionStart;
          render();
          const updatedInput = document.querySelector('input[type="search"]');
          updatedInput.focus();
          updatedInput.setSelectionRange(cursor, cursor);
        });
      });
    }

    function navigateScreen(nextScreen) {
      screen = nextScreen;
      if (screen === "create") {
        createStep = 1;
        Object.assign(draft, emptyDraft());
        photos.forEach((url) => URL.revokeObjectURL(url));
        photos = [];
      }
      updateUrl();
      render();
    }

    function openThread(id) {
      const thread = threads.find((entry) => entry.id === id);
      thread.unread = false;
      activityTab = thread.role === "sell" ? "sales" : "purchases";
      activityThread = id;
      screen = "activity";
      updateUrl();
      render();
      window.scrollTo(0, 0);
    }

    function navigateActivity(tab) {
      activityTab = tab;
      activityThread = 0;
      showHidden = false;
      screen = "activity";
      updateUrl();
      render();
    }

    function addPhotos(files) {
      const images = [...files].filter((file) => file.type.startsWith("image/")).slice(0, maxPhotos - photos.length);
      if (!images.length) return;
      photos = [...photos, ...images.map((file) => URL.createObjectURL(file))];
      render();
    }

    function validateCurrentStep() {
      const form = document.querySelector(".publish-content");
      const fields = form.querySelectorAll("input[required], select[required], textarea[required]");
      for (const field of fields) {
        if (!field.checkValidity()) {
          field.reportValidity();
          return false;
        }
      }
      if (createStep === 3 && draft.ageGroups.length === 0) {
        const agePicker = form.querySelector(".age-picker");
        agePicker.setAttribute("aria-invalid", "true");
        agePicker.querySelector(".age-error").hidden = false;
        agePicker.querySelector('input[name="ageGroup"]').focus();
        return false;
      }
      return true;
    }

    document.querySelector("#app").addEventListener("pointerdown", (event) => {
      if (event.target.closest("[data-suggestion-value]")) event.preventDefault();
    });

    document.querySelector("#app").addEventListener("click", (event) => {
      const removePhoto = event.target.closest("[data-remove-photo]");
      if (removePhoto) {
        const [removed] = photos.splice(Number(removePhoto.dataset.removePhoto), 1);
        URL.revokeObjectURL(removed);
        render();
        return;
      }
      const categoryTile = event.target.closest("[data-pick-category]");
      if (categoryTile) {
        if (draft.category !== categoryTile.dataset.pickCategory) {
          Object.assign(draft, emptyDraft(), { category: categoryTile.dataset.pickCategory });
        }
        createStep = 2;
        render();
        return;
      }
      const suggestionOption = event.target.closest("[data-suggestion-value]");
      if (suggestionOption) {
        const field = suggestionOption.closest(".suggestion-field");
        const input = field.querySelector("input");
        const key = input.dataset.suggestionKey;
        const value = rememberValue(key, suggestionOption.dataset.suggestionValue);
        input.value = value;
        draft[input.name] = value;
        suggestionOption.closest(".suggestion-list").classList.remove("open");
        field.querySelector("[data-suggestion-toggle]").setAttribute("aria-expanded", "false");
        input.focus();
        return;
      }
      const suggestionToggle = event.target.closest("[data-suggestion-toggle]");
      if (suggestionToggle) {
        const list = suggestionToggle.closest(".suggestion-field").querySelector(".suggestion-list");
        const open = !list.classList.contains("open");
        list.classList.toggle("open", open);
        suggestionToggle.setAttribute("aria-expanded", String(open));
        return;
      }
      const galleryButton = event.target.closest("[data-gallery]");
      if (galleryButton) {
        const count = (items.find((entry) => entry.title === detailTitle).photos || []).length;
        detailPhoto = (detailPhoto + Number(galleryButton.dataset.gallery) + count) % count;
        render();
        return;
      }
      const detailPhotoButton = event.target.closest("[data-detail-photo]");
      if (detailPhotoButton) {
        detailPhoto = Number(detailPhotoButton.dataset.detailPhoto);
        render();
        return;
      }
      const detailLink = event.target.closest("[data-detail]");
      if (detailLink && !event.target.closest("[data-action]")) {
        detailTitle = detailLink.dataset.detail;
        detailPhoto = 0;
        navigateScreen("detail");
        window.scrollTo(0, 0);
        return;
      }
      const button = event.target.closest("[data-action]");
      if (!button) return;
      if (button.matches("a")) event.preventDefault();
      switch (button.dataset.action) {
        case "create-listing":
          navigateScreen("create");
          break;
        case "browse":
          navigateScreen("browse");
          break;
        case "toggle-hidden": {
          const thread = threads.find((entry) => entry.id === Number(button.dataset.id));
          thread.hidden = !thread.hidden;
          if (thread.hidden && !button.dataset.stay) { activityThread = 0; showHidden = false; }
          if (!hiddenCount(thread.role)) showHidden = false;
          render();
          break;
        }
        case "toggle-show-hidden":
          showHidden = !showHidden;
          render();
          break;
        case "open-thread":
          openThread(Number(button.dataset.id));
          break;
        case "close-thread":
          activityThread = 0;
          render();
          break;
        case "answer-offer": {
          const thread = threads.find((entry) => entry.id === Number(button.dataset.id));
          thread.events[Number(button.dataset.index)].state = button.dataset.answer;
          render();
          break;
        }
        case "open-notification": {
          const note = notificationItems[Number(button.dataset.index)];
          if (note.thread) openThread(note.thread);
          else {
            detailTitle = note.item;
            detailPhoto = 0;
            navigateScreen("detail");
            window.scrollTo(0, 0);
          }
          break;
        }
        case "activity-tab":
          navigateActivity(button.dataset.tab);
          break;
        case "reset-filters":
          selectedCategory = "Tout";
          selectedConditions = [];
          Object.keys(selectedItemFilters).forEach((key) => delete selectedItemFilters[key]);
          freeOnly = false;
          underTen = false;
          sortOrder = "recent";
          render();
          break;
        case "next-step":
          if (!validateCurrentStep()) return;
          createStep = Math.min(createStep + 1, 4);
          render();
          break;
        case "previous-step":
          createStep = Math.max(createStep - 1, 1);
          render();
          break;
        case "publish":
          items.unshift({
            title: draft.title,
            category: draft.category,
            subcategory: draft.subcategory,
            condition: draft.condition,
            price: Number.parseFloat(draft.price) === 0 ? "Don" : `${draft.price} €`,
            brand: draft.brand,
            author: draft.author,
            language: draft.language,
            color: draft.color,
            ageGroups: [...draft.ageGroups],
            owner: "Marie",
            age: "à l’instant",
            icon: "📦",
            art: "art-green",
            photos: [...photos],
          });
          navigateScreen("success");
          break;
      }
    });

    document.querySelector("#app").addEventListener("input", (event) => {
      const target = event.target;
      if (target.name && Object.hasOwn(draft, target.name)) draft[target.name] = target.value;
      if (target.dataset.suggestionKey) {
        const key = target.dataset.suggestionKey;
        const list = document.querySelector(`#suggestions-${key}`);
        if (list) {
          list.innerHTML = suggestionOptions(key, target.value);
          list.classList.add("open");
          target.parentElement.querySelector("[data-suggestion-toggle]").setAttribute("aria-expanded", "true");
        }
      }
      if (target.name === "price") {
        const hint = target.parentElement.querySelector(".field-hint");
        if (hint) hint.textContent = Number.parseFloat(target.value || "0") === 0
          ? "Le prix à 0 € sera affiché comme un don."
          : "Prix affiché aux autres familles.";
      }
    });

    document.querySelector("#app").addEventListener("focusout", (event) => {
      const target = event.target;
      if (!target.dataset.suggestionKey) return;
      const normalizedValue = rememberValue(target.dataset.suggestionKey, target.value);
      target.value = normalizedValue;
      draft[target.name] = normalizedValue;
      const list = document.querySelector(`#suggestions-${target.dataset.suggestionKey}`);
      if (list) list.classList.remove("open");
      const toggle = target.parentElement.querySelector("[data-suggestion-toggle]");
      if (toggle) toggle.setAttribute("aria-expanded", "false");
    });

    document.querySelector("#app").addEventListener("change", (event) => {
      const target = event.target;
      if (target.matches('input[name="ageGroup"]')) {
        const age = Number(target.value);
        draft.ageGroups = target.checked
          ? [...new Set([...draft.ageGroups, age])].sort((left, right) => left - right)
          : draft.ageGroups.filter((selectedAge) => selectedAge !== age);
        render();
        return;
      }
      if (target.name && Object.hasOwn(draft, target.name)) draft[target.name] = target.value;
      if (target.name === "color" || target.name === "subcategory") {
        render();
        return;
      }
      if (target.matches("[data-filter='free']")) freeOnly = target.checked;
      if (target.matches("[data-filter='under-ten']")) underTen = target.checked;
      if (target.matches("[data-item-filter]")) selectedItemFilters[target.dataset.itemFilter] = target.value;
      if (target.matches("[data-condition]")) {
        const condition = target.dataset.condition;
        selectedConditions = target.checked
          ? [...selectedConditions, condition]
          : selectedConditions.filter((selected) => selected !== condition);
      }
      if (target.matches("[data-sort]")) sortOrder = target.value;
      if (target.id === "draft-photo") addPhotos(target.files);
      if (target.matches("[data-filter], [data-condition], [data-item-filter], [data-sort]")) render();
    });

    document.querySelector("#app").addEventListener("submit", (event) => {
      event.preventDefault();
      const form = event.target;
      const data = new FormData(form);
      const text = String(data.get("text") || "").trim();
      if (form.matches("[data-thread-form]")) {
        if (!text) return;
        const thread = threads.find((entry) => entry.id === Number(form.dataset.id));
        thread.events.push({ from: "me", type: "message", value: text, state: "", at: Date.now() });
        render();
        document.querySelector("[data-thread-form] input").focus();
      }
      if (form.matches("[data-renew-form]")) {
        const thread = threads.find((entry) => entry.id === Number(form.dataset.id));
        thread.events.push({ from: "me", type: "offer", value: `${Number.parseInt(data.get("amount"), 10) || 0} €`, state: "En attente", at: Date.now() });
        render();
      }
      if (form.matches("[data-offer-form]")) {
        const item = items.find((entry) => entry.title === form.dataset.title);
        let thread = threads.find((entry) => entry.role === "buy" && entry.title === item.title);
        if (!thread) {
          thread = { id: Math.max(...threads.map((entry) => entry.id)) + 1, role: "buy", title: item.title, with: item.owner, unread: false, events: [] };
          threads.push(thread);
        }
        const amount = item.price === "Don" ? "Don" : `${Number.parseInt(data.get("amount"), 10) || 0} €`;
        thread.hidden = false;
        thread.events.push({ from: "me", type: "offer", value: amount, state: "En attente", at: Date.now() });
        if (text) thread.events.push({ from: "me", type: "message", value: text, state: "", at: Date.now() + 1 });
        openThread(thread.id);
      }
    });

    document.querySelector("#app").addEventListener("dragover", (event) => {
      const dropZone = event.target.closest("#photo-drop-zone");
      if (!dropZone) return;
      event.preventDefault();
      dropZone.classList.add("dragging");
    });
    document.querySelector("#app").addEventListener("dragleave", (event) => {
      const dropZone = event.target.closest("#photo-drop-zone");
      if (dropZone && !dropZone.contains(event.relatedTarget)) dropZone.classList.remove("dragging");
    });
    document.querySelector("#app").addEventListener("drop", (event) => {
      const dropZone = event.target.closest("#photo-drop-zone");
      if (!dropZone) return;
      event.preventDefault();
      dropZone.classList.remove("dragging");
      addPhotos(event.dataTransfer.files);
    });

    function changeVariant(direction) {
      const index = variants.findIndex((variant) => variant.key === currentVariant);
      currentVariant = variants[(index + direction + variants.length) % variants.length].key;
      updateUrl();
      render();
    }

    document.querySelector("#previous").addEventListener("click", () => changeVariant(-1));
    document.querySelector("#next").addEventListener("click", () => changeVariant(1));
    document.addEventListener("keydown", (event) => {
      if (event.target instanceof HTMLElement && (event.target.matches("input, textarea, [contenteditable='true']"))) return;
      if (event.key === "ArrowLeft") changeVariant(-1);
      if (event.key === "ArrowRight") changeVariant(1);
    });
    window.addEventListener("popstate", () => {
      currentVariant = readVariant();
      const requestedScreen = new URLSearchParams(location.search).get("screen");
      screen = requestedScreen === "create" ? "create" : requestedScreen === "success" ? "success" : requestedScreen === "activity" ? "activity" : "browse";
      if (requestedScreen === "detail") { screen = "detail"; detailTitle = new URLSearchParams(location.search).get("item") || ""; }
      activityTab = new URLSearchParams(location.search).get("tab") || "sales";
      activityThread = 0;
      render();
    });
    render();
  </script>
</body>
</html>
